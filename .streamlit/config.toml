[theme]
base = "light"
primaryColor = "#6842D9"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1B24"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
borderColor = "#E3E1E8"
linkColor = "#6842D9"
codeBackgroundColor = "#F0EDF8"
baseRadius = "1.15rem"
buttonRadius = "0.9rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
paddingBottom = "3rem"
baseFontSize = 15
baseFontWeight = 400
metricValueFontSize = "2.15rem"
metricValueFontWeight = 650
headingFontSizes = ["2.5rem", "1.75rem", "1.35rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
yellowColor = "#B58B16"
yellowBackgroundColor = "#FFF7D7"
yellowTextColor = "#5A4300"
violetColor = "#6842D9"
violetBackgroundColor = "#EEE8FF"
violetTextColor = "#4E2BAD"
greenColor = "#177A70"
greenBackgroundColor = "#DFF5F0"
greenTextColor = "#105C55"
chartCategoricalColors = ["#6842D9", "#C9A227", "#2B827B", "#A98CEA", "#756F80", "#E3C85A"]
dataframeHeaderBackgroundColor = "#241C34"
dataframeHeaderTextColor = "#FFFFFF"
dataframeBorderColor = "#E3E1E8"

[theme.sidebar]
backgroundColor = "#15131B"
secondaryBackgroundColor = "#211E2A"
codeBackgroundColor = "#211E2A"
textColor = "#F7F5FA"
borderColor = "#322E3D"
primaryColor = "#8B6AF0"
linkColor = "#E4C64E"
paddingTop = "1.35rem"
paddingBottom = "2rem"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

