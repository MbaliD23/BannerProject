[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#071F25"
secondaryBackgroundColor = "#0D3038"
textColor = "#F7FAFC"
font = "sans-serif"
borderColor = "#31515A"
linkColor = "#7DE9DE"
codeBackgroundColor = "#06191E"
baseRadius = "1rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
paddingBottom = "2rem"
metricValueFontSize = "2rem"
metricValueFontWeight = 700
headingFontWeights = [750, 700, 650, 600, 600, 600]
chartCategoricalColors = ["#8B5CF6", "#16D9C4", "#F4D84A", "#EF4A82", "#69A9FF", "#9AE6B4"]
dataframeHeaderBackgroundColor = "#123640"
dataframeHeaderTextColor = "#F7FAFC"
dataframeBorderColor = "#31515A"

[theme.sidebar]
backgroundColor = "#06191E"
secondaryBackgroundColor = "#0D3038"
codeBackgroundColor = "#071F25"
textColor = "#F7FAFC"
borderColor = "#31515A"
primaryColor = "#8B5CF6"
linkColor = "#7DE9DE"
paddingTop = "1rem"
paddingBottom = "1.5rem"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

