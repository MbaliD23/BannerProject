[theme]
base = "light"
primaryColor = "#6F42D9"
backgroundColor = "#F7F7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12383C"
font = "sans-serif"
borderColor = "#D7D2E2"
linkColor = "#6F42D9"
codeBackgroundColor = "#F1EEF8"
baseRadius = "1rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
paddingBottom = "2rem"
metricValueFontSize = "2rem"
metricValueFontWeight = 700
headingFontWeights = [750, 700, 650, 600, 600, 600]
yellowColor = "#A77B00"
yellowBackgroundColor = "#FFF6C9"
yellowTextColor = "#5E4500"
chartCategoricalColors = ["#6F42D9", "#D5A800", "#4B2A91", "#A77B00", "#9A7BE8", "#FFF1A8"]
dataframeHeaderBackgroundColor = "#123F45"
dataframeHeaderTextColor = "#F7FAFC"
dataframeBorderColor = "#D7D2E2"

[theme.sidebar]
backgroundColor = "#07343A"
secondaryBackgroundColor = "#0D454C"
codeBackgroundColor = "#0A3B41"
textColor = "#F7FAFC"
borderColor = "#2B5B60"
primaryColor = "#6F42D9"
linkColor = "#F2D43D"
paddingTop = "1rem"
paddingBottom = "1.5rem"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

