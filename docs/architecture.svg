<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Banner Analytics architecture</title>
  <desc id="desc">The scheduler triggers Playwright collection, OCR and analysis, which store results in PostgreSQL and image storage for the Streamlit dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071f25"/><stop offset="1" stop-color="#123640"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16d9c4"/></marker>
  </defs>
  <rect width="1200" height="410" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#f7fafc" text-anchor="middle" filter="url(#shadow)">
    <rect x="55" y="145" width="170" height="105" rx="18" fill="#0d3038" stroke="#16d9c4"/><text x="140" y="188" font-size="18" font-weight="700">APScheduler</text><text x="140" y="217" font-size="13" fill="#9fb6bb">Daily, configurable</text>
    <rect x="285" y="75" width="190" height="105" rx="18" fill="#0d3038" stroke="#8b5cf6"/><text x="380" y="118" font-size="18" font-weight="700">Playwright</text><text x="380" y="147" font-size="13" fill="#9fb6bb">Carousel capture</text>
    <rect x="285" y="235" width="190" height="105" rx="18" fill="#0d3038" stroke="#8b5cf6"/><text x="380" y="278" font-size="18" font-weight="700">OCR + analysis</text><text x="380" y="307" font-size="13" fill="#9fb6bb">Rules and visual signals</text>
    <rect x="555" y="75" width="190" height="105" rx="18" fill="#0d3038" stroke="#f4d84a"/><text x="650" y="118" font-size="18" font-weight="700">Image evidence</text><text x="650" y="147" font-size="13" fill="#9fb6bb">Persistent history</text>
    <rect x="555" y="235" width="190" height="105" rx="18" fill="#0d3038" stroke="#f4d84a"/><text x="650" y="278" font-size="18" font-weight="700">PostgreSQL</text><text x="650" y="307" font-size="13" fill="#9fb6bb">Immutable captures</text>
    <rect x="825" y="145" width="215" height="105" rx="18" fill="#38206a" stroke="#8b5cf6"/><text x="932" y="188" font-size="18" font-weight="700">Streamlit dashboard</text><text x="932" y="217" font-size="13" fill="#d5c7ff">Insights and exports</text>
  </g>
  <g fill="none" stroke="#16d9c4" stroke-width="3" marker-end="url(#arrow)"><path d="M225 197 L278 127"/><path d="M380 180 L380 228"/><path d="M475 127 L548 127"/><path d="M475 287 L548 287"/><path d="M745 287 C790 287 790 220 818 210"/><path d="M745 127 C790 127 790 174 818 184"/></g>
</svg>

